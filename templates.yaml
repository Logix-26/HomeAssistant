
- sensor:
  - name: "Auto Lights - Entry"
    state: >
      {% if is_state('input_boolean.presence_lights_active', 'on') and is_state('timer.entry_override_lights', 'idle') %}
        {% if is_state('binary_sensor.occupancy_entry', 'on') %}
          Detected
        {% else %}
          Clear
        {% endif %}
      {% else %}
        {% if is_state('binary_sensor.occupancy_entry', 'on') %}
          Disabled (Detected)
        {% else %}
          Disabled (Clear)
        {% endif %}
      {% endif %}
    icon: >-
      {% if is_state('input_boolean.presence_lights_active', 'on') and is_state('timer.entry_override_lights', 'idle') %}
        {% if is_state('binary_sensor.occupancy_entry', 'on') %}
          mdi:home
        {% else %}
          mdi:home-outline
        {% endif %}
      {% else %}
        {% if is_state('binary_sensor.occupancy_entry', 'on') %}
          mdi:home-off
        {% else %}
          mdi:home-off-outline
        {% endif %}
      {% endif %}

