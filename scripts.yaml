fade_volume:
  alias: Fade the volume of a media player
  mode: restart
  fields:
    target_player:
      name: Target media player
      description: Target media player of volume fade.
      required: true
      example: media_player.lounge_sonos
      selector:
        entity:
          domain: media_player
    target_volume:
      name: Target volume
      description: Volume the media play will be at the end of the fade duration.
      required: true
      default: 0.5
      example: '0.5'
      selector:
        number:
          max: 1
          min: 0
          step: 0.01
          mode: slider
    duration:
      name: Fade duration
      description: Length of time in seconds the fade should take.
      required: true
      default: 5
      example: '5'
      selector:
        number:
          mode: box
          min: 0
          max: 100000
          unit_of_measurement: s
    curve:
      name: Fade curve algorithm
      description: Shape of the fade curve to apply.
      required: true
      default: logarithmic
      example: logarithmic
      selector:
        select:
          options:
          - logarithmic
          - bezier
          - linear
  variables:
    steps_per_second: 10
    total_steps: '{{ (steps_per_second * duration) | int(0) }}'
    start_volume: '{{ state_attr(target_player, ''volume_level'') | float(0) }}'
    start_diff: '{{ (target_volume - start_volume) | float(0) }}'
  sequence:
  - repeat:
      while:
      - condition: template
        value_template: '{{ repeat.index < total_steps }}'
      - condition: template
        value_template: '{{ ((state_attr(target_player, "volume_level") - target_volume)
          | abs) > 0.001 }}'
      sequence:
      - service: media_player.volume_set
        data_template:
          entity_id: '{{ target_player }}'
          volume_level: "{% set t = repeat.index / total_steps %} {% if curve == 'logarithmic'\
            \ %}\n  {{ (start_volume + (t / (1 + (1 - t))) * start_diff) | float(0)\
            \ }}\n{% elif curve == 'bezier' %}\n  {{ (start_volume + (t * t * (3 -\
            \ 2 * t)) * start_diff) | float(0) }}\n{% else %}\n  {{ (start_volume\
            \ + t * start_diff) | float(0) }}\n{% endif %}\n"
      - delay: '00:00:00.1'
  - service: media_player.volume_set
    data_template:
      entity_id: '{{ target_player }}'
      volume_level: '{{ target_volume }}'
  icon: mdi:tune-vertical
light_coalesce:
  alias: Light Coalesce
  sequence:
  - service: script.debug_log
    data:
      notify_text: No lights found to trigger
  - stop: No lights found to trigger
    error: true
  mode: queued
  fields:
    devices:
      selector:
        entity:
          multiple: true
          domain:
          - light
          - switch
      name: Light/Switch Entities
      required: true
      description: In order, the first available light found will be triggered. No
        others.
    state:
      selector:
        select:
          options:
          - 'On'
          - 'Off'
          - Toggle
      default: Toggle
      name: Switch Type
      required: true
    brightness:
      selector:
        number:
          min: 0
          max: 100
          step: 1
      default: 100
      name: Brightness
      required: false
    transition_seconds:
      selector:
        number:
          min: 0
          max: 300
          step: 1
      default: 2
      name: Transition (seconds)
      required: false
    color_temp:
      selector:
        number:
          min: 153
          max: 500
          step: 1
      name: Color Temp
      default: 175
      required: false
  icon: mdi:lightbulb-multiple-outline
debug_log:
  alias: Debug Log
  sequence:
  - if:
    - condition: state
      entity_id: input_boolean.debug_mode
      state: 'on'
    then:
    - service: notify.mobile_app_joel_s24
      data:
        message: <b>DEBUG:</b> {{ notify_text }}
  mode: single
  icon: mdi:timeline-question
  fields:
    notify_text:
      selector:
        text:
          prefix: 'DEBUG: '
      required: true
      name: Notify Text
presense_sensing_living_area:
  alias: Presense Sensing - Living Area
  sequence:
  - alias: Trigger Actions
    choose:
    - conditions:
      - alias: Trigger = 'Dining Room - On'
        condition: template
        value_template: '{{ trigger == "Dining Room - On" }}'
      - condition: template
        value_template: '{{ auto_on }}'
      - condition: state
        entity_id: timer.dining_room_override_lights
        state: idle
      sequence:
      - service: script.light_coalesce
        metadata: {}
        data:
          state: 'On'
          brightness: '{{ brightness | int }}'
          devices:
          - light.dining_room_local
          - light.dining_room_cloud
          transition_seconds: '{{ transition | int }}'
          color_temp: '{{ color_temp | int }}'
    - conditions:
      - alias: Trigger = 'Dining Room - Off'
