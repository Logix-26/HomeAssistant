'1711716326355':
  alias: Scheduled Auto Update Items
  sequence:
  - repeat:
      for_each: '{{ devices | list }}'
      sequence: []
  mode: queued
  fields:
    update_list:
      selector:
        entity:
          multiple: true
          domain:
          - update
      name: Update Items
      required: true
      description: Elements To Check And Update
    time_of_day:
      selector:
        time: {}
      name: Time of Day
      required: true
  icon: mdi:upload-lock
  max: 10
repeat_reminders:
  alias: Repeat Reminders
  sequence:
  - delay: '{{ wait_for | default(''00:00:00'') }}'
  - repeat:
      sequence:
      - data:
          title: '{{ notification_title }}'
          message: '{{ notification_message }}'
          data:
            '[object Object]': null
        target: '{{ notification_targets }}'
        action: notify.notify
      - delay: '{{ remind_every }}'
      while:
      - condition: template
        value_template: '{{ loop_if }}'
  fields:
    loop_if:
      selector:
        condition: {}
      name: Loop If
      description: Reminder will continue until this is false
      required: true
    remind_every:
      selector:
        duration:
          enable_day: true
      name: Remind Every
      description: How often to send reminders
      default:
        hours: 1
        minutes: 0
        seconds: 0
        days: 0
      required: true
    notification_title:
      selector:
        text: null
      name: Notification Title
      required: false
    notification_message:
      selector:
        text: null
      name: Notification Message
      required: true
    notification_data:
      selector:
        template: {}
      name: Notification Data
      default: ''
      required: false
    notification_targets:
      selector:
        target: {}
      name: Notification Targets
      required: true
    wait_for:
      selector:
        duration: {}
      name: Wait For
      description: How long to wait initially before starting the loop
      required: false
  description: Sends reminders at regular intervals until the specified condition
    becomes false.
  icon: mdi:bell-cog-outline
