      message: The garage door is open.
      data:
        notification_icon: mdi:garage-open-variant
        tag: garage-open-alert
        color: '#FF6600'
        car_ui: true
        actions:
        - action: CLOSE_GARAGE_NOW
          title: Close Garage
          icon: mdi:garage-lock
        - action: CLOSE_GARAGE_ON_LEAVE
          title: Close on Leave
          icon: mdi:exit-run
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: CLOSE_GARAGE_NOW
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: CLOSE_GARAGE_ON_LEAVE
    - trigger: state
      entity_id: cover.smart_garage_door_opener_door
      to: closed
    timeout: 00:30:00
    continue_on_timeout: false
  - condition: template
    value_template: '{{ wait.trigger is not none }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.platform == ''state'' }}'
      sequence:
      - action: notify.notify_joel
        data:
          message: clear_notification
          data:
            tag: garage-open-alert
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''CLOSE_GARAGE_NOW''
          }}'
      sequence:
      - device_id: 6737c7de72a532fd44e29f33cdf93028
        domain: cover
        entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
        type: close
      - action: notify.notify_joel
        data:
          title: Closing Garage 🔐
          message: Got it, closing the garage door.
          data:
            notification_icon: mdi:garage-variant-lock
            tag: garage-open-alert
            color: '#00FF00'
            timeout: 120
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''CLOSE_GARAGE_ON_LEAVE''
          }}'
      sequence:
      - action: notify.notify_joel
        data:
          title: Got it 👍
          message: Garage will close automatically when you leave home.
          data:
            notification_icon: mdi:garage-open-variant
            tag: garage-open-alert
            color: '#0088FF'
            timeout: 120
      - choose:
        - conditions:
          - condition: numeric_state
            entity_id: zone.home
            below: 1
          sequence:
          - device_id: 6737c7de72a532fd44e29f33cdf93028
            domain: cover
            entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
            type: close
          - action: notify.notify_joel
            data:
              title: Garage Closed 🔐
              message: Garage door closed as you left home.
              data:
                notification_icon: mdi:garage-variant-lock
                tag: garage-open-alert
                color: '#00FF00'
                timeout: 120
        default:
        - wait_for_trigger:
          - trigger: state
            entity_id: zone.home
            to: '0'
          timeout: 04:00:00
          continue_on_timeout: true
        - condition: template
          value_template: '{{ wait.trigger is not none }}'
        - device_id: 6737c7de72a532fd44e29f33cdf93028
          domain: cover
          entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
          type: close
        - action: notify.notify_joel
