- id: '1708682792300'
  alias: Timer Finish Triggers
  description: ''
  trigger:
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.vacuum_start_cooldown
    alias: Vacuum Timer Done
    id: VACUUM
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.garage_auto_close_cooldown
    alias: Garage Door Timer Done
    id: GARAGE
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - VACUUM
      sequence:
      - data:
          title: Starting Vacuum 🧹
          message: Just having a quick wash while you're out 😶‍🌫️🚿
          data:
            notification_icon: mdi:robot-vacuum
            tag: vacuum-startup
            color: '#00FF00'
            group: test-notifications
            chronometer: true
            when: '{{ now() | as_timestamp | int }}'
        action: notify.notify_all_people
      - target:
          device_id: 256c14799ff75c5937b5c678bc54f2ab
        data: {}
        action: vacuum.start
      alias: VACUUM
    - conditions:
      - condition: trigger
        id:
        - GARAGE
      - condition: device
        device_id: 6737c7de72a532fd44e29f33cdf93028
        domain: cover
        entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
        type: is_open
      - condition: not
        conditions:
        - condition: device
          device_id: 6737c7de72a532fd44e29f33cdf93028
          domain: cover
          entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
          type: is_closing
        - condition: device
          device_id: 6737c7de72a532fd44e29f33cdf93028
          domain: cover
          entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
          type: is_opening
      sequence:
      - data:
          message: I feel exposed... closing the garage door... 🫣
          title: 'Closing Garage Door 🔐 '
          data:
            notification_icon: mdi:garage-variant-lock
            tag: garage-auto-close
            color: '#00FF00'
            group: garage-auto-close
            timeout: 300
        action: notify.notify_all_people
      - device_id: 6737c7de72a532fd44e29f33cdf93028
        domain: cover
        entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
        type: close
      alias: GARAGE
  mode: single
- id: '1709822092940'
  alias: Living Area - Night Lights
  description: ''
  triggers:
  - type: occupied
    device_id: b47e860070e428c00a834bafcd5dc2ae
    entity_id: 9674f2155da2f68640bed975c8cc9b21
    domain: binary_sensor
    id: Person Seen
    trigger: device
  - type: not_occupied
    device_id: b47e860070e428c00a834bafcd5dc2ae
    entity_id: 9674f2155da2f68640bed975c8cc9b21
    domain: binary_sensor
    id: Person Gone
    for:
      hours: 0
      minutes: 2
      seconds: 0
    trigger: device
  - alias: Night
    at: '23:00:00'
    id: Night Time
    trigger: time
  - at: 07:00:00
    alias: Morning
    id: Morning Time
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Night Time
      sequence:
      - target:
          entity_id:
          - light.5m_light_strip
          - light.5m_light_strip_local
        data: {}
        action: light.turn_off
    - conditions:
      - condition: trigger
        id:
        - Morning Time
      sequence:
      - target:
          entity_id:
          - light.5m_light_strip
          - light.5m_light_strip_local
        data:
          brightness_pct: 62
          color_name: lightskyblue
        action: light.turn_on
    - conditions:
      - condition: trigger
        id:
        - Person Seen
      - condition: time
        after: '23:00:00'
        before: 07:00:00
      - condition: or
        conditions:
        - condition: device
          type: is_off
          device_id: 7e0cb4c910860c4830a8c4a98f8010de
          entity_id: d75e3141bfb340b046dd400127276798
          domain: light
        - condition: device
          type: is_off
          device_id: 89112ded161fc441678f2efbc1b7772d
          entity_id: 647da1f3d54eebbee241347dcde0b981
          domain: light
      sequence:
      - target:
          entity_id:
          - light.5m_light_strip
          - light.5m_light_strip_local
        data:
          color_name: lightsalmon
          brightness_pct: 20
        action: light.turn_on
    - conditions:
      - condition: trigger
        id:
        - Person Gone
      - condition: time
        after: '23:00:00'
        before: 07:00:00
      sequence:
      - target:
          entity_id:
          - light.5m_light_strip
          - light.5m_light_strip_local
        data: {}
        action: light.turn_off
  mode: single
- id: '1710160809162'
  alias: Presense Lights - Living Area
  description: ''
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.occupancy_dining_room
    to: 'on'
    id: Dining Room - On
  - platform: state
    entity_id:
    - binary_sensor.occupancy_dining_room
    to: 'off'
