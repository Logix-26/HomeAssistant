- id: '1706880188055'
  alias: Vacuum - Empty House
  description: ''
  triggers:
  - alias: When no one is home for 2 minutes
    entity_id:
    - zone.home
    for:
      hours: 0
      minutes: 0
      seconds: 0
    to: '0'
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: time
      weekday:
      - sat
      after: 00:00:00
      before: '12:00:00'
  actions:
  - parallel:
    - alias: Start Vacuum After Delay
      sequence:
      - delay:
          hours: 0
          minutes: 2
          seconds: 5
          milliseconds: 0
      - alias: Start Vacuum
        if:
        - condition: state
          entity_id: zone.home
          state: '0'
          for:
            hours: 0
            minutes: 2
            seconds: 0
          enabled: true
        - alias: Test if Vacuum is not already going
          condition: not
          conditions:
          - condition: device
            device_id: 256c14799ff75c5937b5c678bc54f2ab
            domain: vacuum
            entity_id: 9f7f21b10f4047b96aa1715b20777fde
            type: is_cleaning
        - condition: state
          entity_id: timer.vacuum_start_cooldown
          state: idle
        then:
        - metadata: {}
          data: {}
          target:
            entity_id: timer.vacuum_start_cooldown
          action: timer.start
        - data:
            title: Preparing Vacuum
            message: "{% set duration = state_attr('timer.vacuum_start_cooldown','duration').split(':')\
              \ %} {% set hours = duration[0] | int %} {% set minutes = duration[1]\
              \ | int %} {% set seconds = duration[2] | int %} {% set parts = [] %}\
              \ {% if hours > 0 %}\n  {% set parts = parts + [hours|string + \"h\"\
              ] %}\n{% endif %} {% if minutes > 0 or (hours > 0 and seconds > 0) %}\n\
              \  {% set parts = parts + [minutes|string + \"m\"] %}\n{% endif %} {%\
              \ if seconds > 0 %}\n  {% set parts = parts + [seconds|string + \"s\"\
              ] %}\n{% endif %} No one is home, vacuum will start after {{ parts|join('\
              \ ') }} unless stopped."
            data:
              notification_icon: mdi:robot-vacuum
              timeout: "{{ \n  (state_attr('timer.vacuum_start_cooldown','finishes_at')\
                \ | as_timestamp | int)\n  - 2 -\n  now() | as_timestamp | int\n}}"
              tag: vacuum-startup
              color: '#0000FF'
              group: test-notifications
              chronometer: true
              when: '{{ state_attr(''timer.vacuum_start_cooldown'',''finishes_at'')
                | as_timestamp | int }}'
              car_ui: true
              actions:
              - action: CANCEL_VACUUM
                title: Cancel Timer
                icon: mdi:stop
              - action: START_VACUUM
                title: Just Send It!
                icon: mdi:play
          action: notify.notify_all_people
        - alias: Listen for notification actions
          timeout: '{{ state_attr(''timer.vacuum_start_cooldown'',''remaining'') }}'
          wait_for_trigger:
          - event_type: mobile_app_notification_action
            event_data:
              action: START_VACUUM
            trigger: event
          - event_type: mobile_app_notification_action
            event_data:
              action: CANCEL_VACUUM
            trigger: event
        - alias: Perform the action
          choose:
          - alias: START_VACUUM
            conditions:
            - condition: template
              value_template: '{{ wait.trigger.event.data.action == ''START_VACUUM''
                }}'
            sequence:
            - data:
                title: Starting Vacuum 🧹
                message: Alright, fine! Someone is impatient, so the vacuum is off...
                  🤨
                data:
                  notification_icon: mdi:robot-vacuum
                  tag: vacuum-startup
                  color: '#00FF00'
                  group: test-notifications
                  chronometer: true
                  when: '{{ now() | as_timestamp | int }}'
              action: notify.notify_all_people
            - metadata: {}
              data: {}
              target:
                entity_id: timer.vacuum_start_cooldown
              action: timer.cancel
            - metadata: {}
              data: {}
              target:
                device_id: 256c14799ff75c5937b5c678bc54f2ab
              action: vacuum.start
          - alias: CANCEL_VACUUM
            conditions:
            - condition: template
              value_template: '{{ wait.trigger.event.data.action == ''CANCEL_VACUUM''
                }}'
            sequence:
            - data:
                title: Cancelled Vacuum 😞
                message: Okay then, dirty house it is! Sorry for suggesting it. 🤮
                data:
                  notification_icon: mdi:robot-vacuum
                  timeout: 60
                  tag: vacuum-startup
                  color: '#FF0000'
                  group: test-notifications
              action: notify.notify_all_people
            - metadata: {}
              data: {}
              target:
                entity_id: timer.vacuum_start_cooldown
              action: timer.cancel
      enabled: true
    - alias: Close Garage After No Delay
      sequence:
      - alias: Close Garage Door
        if:
        - condition: state
          entity_id: zone.home
          state: '0'
          for:
            hours: 0
            minutes: 0
            seconds: 0
          enabled: true
        - condition: device
          device_id: 6737c7de72a532fd44e29f33cdf93028
          domain: cover
          entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
          type: is_open
        - condition: state
          state: idle
          entity_id: timer.garage_auto_close_cooldown
        then:
        - metadata: {}
          data: {}
          target:
            entity_id:
            - timer.garage_auto_close_cooldown
          action: timer.start
        - data:
            title: Garage Auto Close
            message: "{% set duration = state_attr('timer.garage_auto_close_cooldown','duration').split(':')\
              \ %} {% set hours = duration[0] | int %} {% set minutes = duration[1]\
              \ | int %} {% set seconds = duration[2] | int %} {% set parts = [] %}\
              \ {% if hours > 0 %}\n  {% set parts = parts + [hours|string + \"h\"\
              ] %}\n{% endif %} {% if minutes > 0 or (hours > 0 and seconds > 0) %}\n\
              \  {% set parts = parts + [minutes|string + \"m\"] %}\n{% endif %} {%\
              \ if seconds > 0 %}\n  {% set parts = parts + [seconds|string + \"s\"\
              ] %}\n{% endif %} Garage door left open, auto closing in {{ parts|join('\
              \ ') }}."
            data:
              notification_icon: mdi:garage-alert-variant
              timeout: "{{ \n  (state_attr('timer.garage_auto_close_cooldown','finishes_at')\
                \ | as_timestamp | int)\n  - 2 -\n  now() | as_timestamp | int\n}}"
              tag: garage-auto-close
              color: '#0000FF'
              group: garage-auto-close
              chronometer: true
              when: '{{ state_attr(''timer.garage_auto_close_cooldown'',''finishes_at'')
                | as_timestamp | int }}'
              car_ui: true
              actions:
              - action: QUICK_GARAGE_CLOSE
                title: Just Do It!
                icon: mdi:play
              - action: CANCEL_GARAGE_CLOSE
                title: Cancel Auto Close
                icon: mdi:stop
          action: notify.notify_all_people
        - alias: Listen for notification actions
          timeout: '{{ state_attr(''timer.garage_auto_close_cooldown'',''remaining'')
            }}'
          wait_for_trigger:
          - event_type: mobile_app_notification_action
            event_data:
              action: QUICK_GARAGE_CLOSE
            trigger: event
          - event_type: mobile_app_notification_action
            event_data:
              action: CANCEL_GARAGE_CLOSE
            trigger: event
        - alias: Perform the action
          choose:
          - alias: QUICK_GARAGE_CLOSE
            conditions:
            - condition: template
              value_template: '{{ wait.trigger.event.data.action == ''QUICK_GARAGE_CLOSE''
                }}'
            sequence:
            - data:
                message: Got it, locking it down!
                title: 'Costing Garage Door 🔐 '
                data:
                  notification_icon: mdi:garage-variant-lock
                  tag: garage-auto-close
                  color: '#00FF00'
                  group: garage-auto-close
                  timeout: 60
                  car_ui: true
              action: notify.notify_all_people
            - metadata: {}
              data: {}
              action: timer.cancel
              target:
                entity_id: timer.garage_auto_close_cooldown
            - device_id: 6737c7de72a532fd44e29f33cdf93028
              domain: cover
              entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
              type: close
          - alias: CANCEL_GARAGE_CLOSE
            conditions:
            - condition: template
              value_template: '{{ wait.trigger.event.data.action == ''CANCEL_GARAGE_CLOSE''
                }}'
            sequence:
            - data:
                data:
                  notification_icon: mdi:garage-open-variant
                  timeout: 60
                  tag: garage-auto-close
                  color: '#FF0000'
                  group: garage-auto-close
                  car_ui: true
                title: Garage Staying Open 🔓
                message: Okay, leaving the garage open, I hope you know what you're
                  doing! 🤞
              action: notify.notify_all_people
            - metadata: {}
              data: {}
              action: timer.cancel
              target:
                entity_id: timer.garage_auto_close_cooldown
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 0
        enabled: false
      enabled: false
    - device_id: a93693ffcf39cba4fc188f3832f84d85
      domain: alarm_control_panel
      entity_id: 349db00063226bd0c61be4333a837763
      type: arm_away
  mode: single
- alias: Someone is home
  description: ''
  triggers:
  - alias: When person 1 gets home
    entity_id:
    - zone.home
    from: '0'
    to: '1'
    trigger: state
  - alias: When person 2 gets home
    entity_id:
    - zone.home
    to: '2'
    enabled: true
    trigger: state
  conditions: []
  actions:
  - parallel:
    - device_id: a93693ffcf39cba4fc188f3832f84d85
      domain: alarm_control_panel
      entity_id: 349db00063226bd0c61be4333a837763
      type: arm_home
    - device_id: 6737c7de72a532fd44e29f33cdf93028
      domain: cover
      entity_id: 6b7c8fb6e3fb75d1b46a0630d40c2655
      type: open
      enabled: true
    - if:
      - condition: device
        device_id: 256c14799ff75c5937b5c678bc54f2ab
        domain: vacuum
        entity_id: 9f7f21b10f4047b96aa1715b20777fde
        type: is_cleaning
      then:
      - device_id: 256c14799ff75c5937b5c678bc54f2ab
        domain: vacuum
        entity_id: 9f7f21b10f4047b96aa1715b20777fde
        type: dock
        enabled: true
      enabled: true
    - metadata: {}
      data:
        title: Docking Roborock ({{ states('sensor.roborock_s8_pro_ultra_cleaning_progress')
          }}%)
        message: Someone is home. Docking vacuum at {{ states('sensor.roborock_s8_pro_ultra_cleaning_progress')
          }}% completion.
        data:
          image: '{{ state_attr(''image.roborock_s8_pro_ultra_map_0'', ''entity_picture'')
            }}'
          timeout: 120
      action: notify.notify_all_people
      enabled: true
  mode: single
  id: '1707024425328'
- id: '1707109812957'
  alias: Set Joel Call Status
  description: ''
  triggers:
  - entity_id:
    - sensor.joel_s_s24_ultra_phone_state
    trigger: state
  - entity_id: person.joel_couchman
    zone: zone.home
    event: enter
    trigger: zone
  - entity_id: person.joel_couchman
    zone: zone.home
    event: leave
    trigger: zone
  conditions: []
  actions:
  - if:
    - condition: or
      conditions:
      - condition: state
        entity_id: sensor.joel_s_s24_ultra_phone_state
        state: offhook
      - condition: state
        entity_id: sensor.joel_s_s24_ultra_phone_state
        state: ringing
    then:
    - if:
      - condition: zone
        entity_id: person.joel_couchman
        zone: zone.home
      then:
      - metadata: {}
        data:
          option: Yes - Home
        target:
          entity_id: input_select.joel_call_status
        action: input_select.select_option
      else:
      - metadata: {}
        data:
          option: Yes - Other
        target:
          entity_id: input_select.joel_call_status
        action: input_select.select_option
    else:
    - metadata: {}
      data:
        option: 'No'
      target:
        entity_id: input_select.joel_call_status
      action: input_select.select_option
  mode: single
