      hours: 0
      minutes: 0
      seconds: 0
    id: 'OFF'
    to: none
    enabled: false
    trigger: state
  - at: '21:00:00'
    id: 'ON'
    trigger: time
  - at: 09:00:00
    id: 'OFF'
